openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Session authentication
  - name: admin
    description: User and role administration
  - name: dashboard
    description: Role-specific dashboard data
  - name: order-hub
    description: Client and central order management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Get the current signed-in user
      responses:
        "200":
          description: Current session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: List users for the administration screen
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
        - name: roleId
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: User records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [admin]
      summary: Create a user with an administrator-assigned password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/{userId}:
    patch:
      operationId: updateUser
      tags: [admin]
      summary: Edit a user, permissions, or password
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deactivateUser
      tags: [admin]
      summary: Deactivate a user without deleting audit history
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: User deactivated
  /roles:
    get:
      operationId: listRoles
      tags: [admin]
      summary: List configurable roles and permission templates
      responses:
        "200":
          description: Role records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
    post:
      operationId: createRole
      tags: [admin]
      summary: Create a custom role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "201":
          description: Created role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
  /roles/{roleId}:
    patch:
      operationId: updateRole
      tags: [admin]
      summary: Edit a role and its default permissions
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdate"
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
    delete:
      operationId: deleteRole
      tags: [admin]
      summary: Delete an unused custom role
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Role deleted
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get the signed-in user's role-specific dashboard shell
      responses:
        "200":
          description: Role-specific dashboard context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Get user and role counts for the Master Admin
      responses:
        "200":
          description: Administration summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
  /clients:
    get:
      operationId: listClients
      tags: [order-hub]
      summary: List clients
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
        - name: includeInactive
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Clients visible to the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientList"
        "401":
          description: Sign in required
        "403":
          description: Client and order access required
    post:
      operationId: createClient
      tags: [order-hub]
      summary: Add a client and assign its order ID prefix
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Client created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          description: Invalid client details
        "401":
          description: Sign in required
        "403":
          description: Edit access required
        "409":
          description: Client prefix already exists
  /clients/{clientId}:
    patch:
      operationId: updateClient
      tags: [order-hub]
      summary: Update client details or deactivate a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          description: Invalid client details
        "401":
          description: Sign in required
        "403":
          description: Edit access required
        "404":
          description: Client not found
        "409":
          description: Client prefix already exists
  /locations:
    get:
      operationId: listOrderLocations
      tags: [order-hub]
      summary: List order locations
      parameters:
        - name: includeInactive
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Locations visible to the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderLocationList"
        "401":
          description: Sign in required
        "403":
          description: Client and order access required
    post:
      operationId: createOrderLocation
      tags: [order-hub]
      summary: Add an order location code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderLocationInput"
      responses:
        "201":
          description: Location created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderLocation"
        "400":
          description: Invalid location details
        "401":
          description: Sign in required
        "403":
          description: Edit access required
        "409":
          description: Location code already exists
  /locations/{locationId}:
    patch:
      operationId: updateOrderLocation
      tags: [order-hub]
      summary: Update or deactivate an order location code
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderLocationUpdate"
      responses:
        "200":
          description: Updated location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderLocation"
        "400":
          description: Invalid location details
        "401":
          description: Sign in required
        "403":
          description: Edit access required
        "404":
          description: Location not found
        "409":
          description: Location code already exists
  /orders:
    get:
      operationId: listOrders
      tags: [order-hub]
      summary: Search and filter central orders
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: clientId
          in: query
          schema:
            type: string
        - name: locationCode
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Matching orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderList"
        "400":
          description: Invalid order filters
        "401":
          description: Sign in required
        "403":
          description: Client and order access required
    post:
      operationId: createOrder
      tags: [order-hub]
      summary: Create an order with a canonical Order ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid order details
        "401":
          description: Sign in required
        "403":
          description: Edit access required
        "404":
          description: Active client or location not found
  /orders/{id}:
    get:
      operationId: getOrder
      tags: [order-hub]
      summary: Get an order from the central hub
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: Sign in required
        "403":
          description: Client and order access required
        "404":
          description: Order not found
    patch:
      operationId: updateOrder
      tags: [order-hub]
      summary: Update an order's lifecycle status or notes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid order update
        "401":
          description: Sign in required
        "403":
          description: Edit access required
        "404":
          description: Order not found
  /order-message-templates:
    get:
      operationId: listOrderMessageTemplates
      tags: [order-hub]
      summary: List centrally configured lifecycle message templates
      responses:
        "200":
          description: Lifecycle message templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderMessageTemplateList"
        "401":
          description: Sign in required
        "403":
          description: Client and order access required
  /order-message-templates/{status}:
    patch:
      operationId: updateOrderMessageTemplate
      tags: [order-hub]
      summary: Update a lifecycle message template
      parameters:
        - name: status
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/OrderStatus"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderMessageTemplateUpdate"
      responses:
        "200":
          description: Updated message template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderMessageTemplate"
        "400":
          description: Invalid message template
        "401":
          description: Sign in required
        "403":
          description: Master Admin access required
        "404":
          description: Message template not found
  /chat/people:
    get:
      operationId: listChatPeople
      tags: [chat]
      summary: List active users available for chat and group membership
      responses:
        "200":
          description: Active users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatPerson"
  /chat/conversations:
    get:
      operationId: listChatConversations
      tags: [chat]
      summary: List the signed-in user's direct conversations and chat groups
      responses:
        "200":
          description: Conversations available to the signed-in user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatConversation"
  /chat/direct-conversations:
    post:
      operationId: startDirectConversation
      tags: [chat]
      summary: Start or reopen a direct conversation with an active user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartDirectConversationInput"
      responses:
        "200":
          description: Direct conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatConversation"
  /chat/conversations/{conversationId}/messages:
    get:
      operationId: listChatMessages
      tags: [chat]
      summary: List recent messages in a conversation the user belongs to
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Messages in chronological order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a text message to a conversation the user belongs to
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
  /chat/conversations/{conversationId}/messages/{messageId}:
    patch:
      operationId: updateChatMessage
      tags: [chat]
      summary: Edit a message sent by the signed-in user
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageUpdate"
      responses:
        "200":
          description: Updated message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
    delete:
      operationId: deleteChatMessage
      tags: [chat]
      summary: Delete a message for all conversation participants
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Message deleted for all participants
  /chat/conversations/{conversationId}:
    delete:
      operationId: deleteChatConversation
      tags: [chat]
      summary: Hide a conversation from the signed-in user's chat list
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Conversation hidden for the signed-in user
  /chat/conversations/{conversationId}/read:
    post:
      operationId: markChatConversationRead
      tags: [chat]
      summary: Mark a conversation as read for the signed-in user
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Read marker updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /admin/chat-groups:
    get:
      operationId: listChatGroups
      tags: [admin]
      summary: List user communication groups for the Master Admin
      responses:
        "200":
          description: Active communication groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatGroup"
    post:
      operationId: createChatGroup
      tags: [admin]
      summary: Create a communication group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatGroupInput"
      responses:
        "201":
          description: Created communication group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatGroup"
  /admin/chat-groups/{groupId}:
    patch:
      operationId: updateChatGroup
      tags: [admin]
      summary: Edit a communication group and its members
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatGroupUpdate"
      responses:
        "200":
          description: Updated communication group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatGroup"
    delete:
      operationId: deleteChatGroup
      tags: [admin]
      summary: Archive a communication group while retaining its message history
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Communication group archived
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PermissionLevel:
      type: string
      enum: [none, view, edit]
    PermissionMap:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/PermissionLevel"
    Role:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        isSystem:
          type: boolean
        permissions:
          $ref: "#/components/schemas/PermissionMap"
      required: [id, name, description, isSystem, permissions]
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        username:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        roleId:
          type: string
        roleName:
          type: string
        status:
          type: string
          enum: [active, inactive]
        lastLogin:
          type: ["string", "null"]
          format: date-time
        permissions:
          $ref: "#/components/schemas/PermissionMap"
        permissionOverrides:
          type: ["object", "null"]
          additionalProperties:
            $ref: "#/components/schemas/PermissionLevel"
      required:
        - id
        - name
        - username
        - email
        - phone
        - avatarUrl
        - roleId
        - roleName
        - status
        - lastLogin
        - permissions
        - permissionOverrides
    AuthSession:
      type: object
      properties:
        authenticated:
          type: boolean
        user:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
      required: [authenticated, user]
    LoginInput:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required: [username, password]
    UserInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 3
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
          maxLength: 180000
        roleId:
          type: string
        password:
          type: string
          minLength: 8
        permissionOverrides:
          type: ["object", "null"]
          additionalProperties:
            $ref: "#/components/schemas/PermissionLevel"
      required: [name, username, roleId, password]
    UserUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 3
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
          maxLength: 180000
        roleId:
          type: string
        password:
          type: string
          minLength: 8
        status:
          type: string
          enum: [active, inactive]
        permissionOverrides:
          type: ["object", "null"]
          additionalProperties:
            $ref: "#/components/schemas/PermissionLevel"
    RoleInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        description:
          type: ["string", "null"]
        permissions:
          $ref: "#/components/schemas/PermissionMap"
      required: [name, permissions]
    RoleUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        description:
          type: ["string", "null"]
        permissions:
          $ref: "#/components/schemas/PermissionMap"
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]
    Client:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        address:
          type: string
        gstin:
          type: ["string", "null"]
        prefix:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, phone, address, gstin, prefix, isActive, createdAt, updatedAt]
    ClientInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          minLength: 7
          maxLength: 20
        address:
          type: string
          minLength: 3
          maxLength: 500
        gstin:
          type: ["string", "null"]
          maxLength: 15
          pattern: "^[0-9A-Za-z]{15}$"
        prefix:
          type: string
          minLength: 1
          maxLength: 8
          pattern: "^[A-Za-z0-9]+$"
      required: [name, phone, address, prefix]
    ClientUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          minLength: 7
          maxLength: 20
        address:
          type: string
          minLength: 3
          maxLength: 500
        gstin:
          type: ["string", "null"]
          maxLength: 15
          pattern: "^[0-9A-Za-z]{15}$"
        prefix:
          type: string
          minLength: 1
          maxLength: 8
          pattern: "^[A-Za-z0-9]+$"
        isActive:
          type: boolean
    ClientList:
      type: array
      items:
        $ref: "#/components/schemas/Client"
    OrderLocation:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, code, name, isActive, createdAt, updatedAt]
    OrderLocationInput:
      type: object
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 5
          pattern: "^[A-Za-z0-9]+$"
        name:
          type: string
          minLength: 2
