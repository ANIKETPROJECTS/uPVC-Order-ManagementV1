openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Session authentication
  - name: admin
    description: User and role administration
  - name: dashboard
    description: Role-specific dashboard data
  - name: order-hub
    description: Client and central order management
  - name: quotations
    description: Window profiles and quotations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Get the current signed-in user
      responses:
        "200":
          description: Current session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /uploads/{category}/{filename}:
    get:
      operationId: serveProjectUpload
      tags: [admin]
      summary: Serve an uploaded avatar or window-profile image
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
            enum: [avatars, window-profiles]
        - name: filename
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9-]+\\.(jpg|png|webp)$"
      responses:
        "200":
          description: Uploaded image bytes
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "401":
          description: Sign-in is required
        "403":
          description: Required module access is missing
        "404":
          description: Image not found
  /users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: List users for the administration screen
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
        - name: roleId
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: User records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [admin]
      summary: Create a user with an administrator-assigned password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/{userId}:
    patch:
      operationId: updateUser
      tags: [admin]
      summary: Edit a user, permissions, or password
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deactivateUser
      tags: [admin]
      summary: Deactivate a user without deleting audit history
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: User deactivated
  /roles:
    get:
      operationId: listRoles
      tags: [admin]
      summary: List configurable roles and permission templates
      responses:
        "200":
          description: Role records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
    post:
      operationId: createRole
      tags: [admin]
      summary: Create a custom role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "201":
          description: Created role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
  /roles/{roleId}:
    patch:
      operationId: updateRole
      tags: [admin]
      summary: Edit a role and its default permissions
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdate"
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
    delete:
      operationId: deleteRole
      tags: [admin]
      summary: Delete an unused custom role
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Role deleted
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get the signed-in user's role-specific dashboard shell
      responses:
        "200":
          description: Role-specific dashboard context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /dashboard/operations:
    get:
      operationId: getOperationsDashboard
      tags: [dashboard]
      summary: Get permission-scoped operational dashboard data
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: q
          in: query
          schema:
            type: string
            maxLength: 120
        - name: stage
          in: query
          schema:
            type: string
        - name: clientId
          in: query
          schema:
            type: string
        - name: locationCode
          in: query
          schema:
            type: string
        - name: installerId
          in: query
          schema:
            type: string
        - name: paymentStatus
          in: query
          schema:
            type: string
        - name: assignment
          in: query
          schema:
            type: string
        - name: glassStatus
          in: query
          schema:
            type: string
        - name: compare
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Filtered dashboard sections and per-section errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsDashboard"
  /dashboard/preferences:
    get:
      operationId: getDashboardPreferences
      tags: [dashboard]
      summary: Get the signed-in user's dashboard preferences
      responses:
        "200":
          description: Saved widget visibility and order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardPreferences"
    put:
      operationId: updateDashboardPreferences
      tags: [dashboard]
      summary: Save the signed-in user's dashboard preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DashboardPreferencesInput"
      responses:
        "200":
          description: Saved widget visibility and order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardPreferences"
  /payments/balance-register:
    get:
      operationId: getBalancePaymentRegister
      tags: [payments]
      summary: List every order with all-time payment progress
      responses:
        "200":
          description: All orders with net paid and outstanding balances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalancePaymentRegisterList"
  /payments/balance-register/{orderRecordId}/transactions:
    get:
      operationId: getBalancePaymentTransactions
      tags: [payments]
      summary: List all receipt and refund records for one order
      parameters:
        - name: orderRecordId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full receipt and refund history for the order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalancePaymentTransactions"
  /payments/overview:
    get:
      operationId: getPaymentOverview
      tags: [payments]
      summary: Get payment totals, balance reminders, and recent payment entries
      responses:
        "200":
          description: Payments dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOverview"
  /payments/flags:
    get:
      operationId: listPaymentFlags
      tags: [payments]
      summary: List flagged payment records with their audit histories
      responses:
        "200":
          description: Flagged payment records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentFlagList"
  /orders/{id}/payment-flags:
    get:
      operationId: listOrderPaymentFlags
      tags: [orders]
      summary: List payment flags for an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment flags for the order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentFlagList"
    post:
      operationId: createOrderPaymentFlag
      tags: [orders]
      summary: Flag a bounced payment or refusal to pay
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentFlagInput"
      responses:
        "201":
          description: Payment flag created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentFlag"
  /payment-flags/{id}/resolve:
    patch:
      operationId: resolvePaymentFlag
      tags: [payments]
      summary: Resolve a payment flag and retain the resolution in its history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentFlagResolution"
      responses:
        "200":
          description: Resolved payment flag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentFlag"
  /payment-flags/{id}:
    patch:
      operationId: updatePaymentFlag
      tags: [payments]
      summary: Edit payment flag details and retain the change in its history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentFlagUpdate"
      responses:
        "200":
          description: Updated payment flag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentFlag"
    delete:
      operationId: removePaymentFlag
      tags: [payments]
      summary: Mark a payment flag removed while preserving its audit history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed payment flag retained for audit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentFlag"
  /payment-flags/{id}/follow-ups:
    post:
      operationId: addPaymentFlagFollowUp
      tags: [payments]
      summary: Append a refusal-to-pay follow-up and retain the action in history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentFlagFollowUpInput"
      responses:
        "200":
          description: Updated payment flag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentFlag"
  /orders/{id}/payment-reminder:
    post:
      operationId: openPaymentReminder
      tags: [payments]
      summary: Open a manual WhatsApp balance reminder for an eligible order
      description: The signed-in user reviews and sends the drafted message manually in WhatsApp. The API does not send or confirm delivery.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "303":
          description: Redirect to the WhatsApp chat with the reminder text prefilled
          headers:
            Location:
              schema:
                type: string
        "409":
          description: The order is not eligible or has no usable client WhatsApp number
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Get user and role counts for the Master Admin
      responses:
        "200":
          description: Administration summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
  /clients:
    get:
      operationId: listClients
      tags: [order-hub]
      summary: List clients
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
        - name: includeInactive
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Clients visible to the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientList"
        "401":
          description: Sign in required
        "403":
          description: Client and order access required
    post:
      operationId: createClient
      tags: [order-hub]
      summary: Add a client, choose its type, and assign its order ID prefix
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Client created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          description: Invalid client details
        "401":
          description: Sign in required
        "403":
          description: Edit access required
        "409":
          description: Client prefix already exists
  /clients/{clientId}:
    patch:
      operationId: updateClient
      tags: [order-hub]
      summary: Update client details or deactivate a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          description: Invalid client details
        "401":
          description: Sign in required
        "403":
          description: Edit access required
        "404":
          description: Client not found
        "409":
          description: Client prefix already exists
  /locations:
    get:
      operationId: listOrderLocations
      tags: [order-hub]
      summary: List order locations
      parameters:
        - name: includeInactive
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Locations visible to the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderLocationList"
        "401":
          description: Sign in required
        "403":
          description: Client and order access required
    post:
      operationId: createOrderLocation
      tags: [order-hub]
      summary: Add an order location code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderLocationInput"
      responses:
        "201":
          description: Location created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderLocation"
        "400":
          description: Invalid location details
        "401":
          description: Sign in required
        "403":
          description: Edit access required
        "409":
          description: Location code already exists
  /locations/{locationId}:
    patch:
      operationId: updateOrderLocation
      tags: [order-hub]
      summary: Update or deactivate an order location code
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderLocationUpdate"
      responses:
        "200":
          description: Updated location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderLocation"
        "400":
          description: Invalid location details
        "401":
          description: Sign in required
        "403":
          description: Edit access required
        "404":
          description: Location not found
        "409":
          description: Location code already exists
  /orders:
    get:
      operationId: listOrders
      tags: [order-hub]
      summary: Search and filter central orders
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: clientId
          in: query
          schema:
            type: string
        - name: locationCode
          in: query
          schema:
            type: string
        - name: locationName
          in: query
          schema:
            type: string
            maxLength: 120
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: includeInactive
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Matching orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderList"
        "400":
          description: Invalid order filters
        "401":
          description: Sign in required
        "403":
          description: Client and order access required
    post:
      operationId: createOrder
      tags: [order-hub]
      summary: Create an order with manual client and site details; link a quotation now or later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid order details
        "401":
          description: Sign in required
        "403":
          description: Edit access required
        "404":
          description: Client, location, or quotation details are invalid
        "409":
          description: The client needs a type, the quotation is already linked, or the generated order ID is already in use
  /orders/{id}:
    get:
      operationId: getOrder
      tags: [order-hub]
      summary: Get an order from the central hub
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: Sign in required
        "403":
          description: Client and order access required
        "404":
          description: Order not found
    patch:
      operationId: updateOrder
      tags: [order-hub]
      summary: Update an order's location, lifecycle status, notes, active state, or quotation link
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid order update
        "401":
          description: Sign in required
        "403":
          description: Edit access required
        "404":
          description: Order not found
        "409":
          description: Quotation is already linked or the generated Order ID is already in use
    delete:
      operationId: deleteOrder
      tags: [order-hub]
      summary: Archive an order while preserving its linked history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Archived order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: Sign in required
        "403":
          description: Edit access required
        "404":
          description: Order not found
  /orders/{id}/lots:
    post:
      operationId: addOrderLot
      tags: [order-hub]
      summary: Add the next server-numbered lot to an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Order with the new lot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: Sign in required
        "403":
          description: Edit access required
        "404":
          description: Order not found
        "409":
          description: The order needs review or cannot accept another lot
  /dispatch/orders:
    get:
      operationId: listDispatchOrders
      tags: [dispatch]
      summary: List orders for dispatch tracking
      responses:
        "200":
          description: Dispatch orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchOrderList"
        "401":
          description: Sign in required
        "403":
          description: Dispatch view access required
  /dispatch/orders/{id}/status:
    patch:
      operationId: updateDispatchOrderStatus
      tags: [dispatch]
      summary: Update an order's dispatch status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchStatusUpdate"
      responses:
        "200":
          description: Updated dispatch order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchOrder"
        "400":
          description: Invalid dispatch status
        "401":
          description: Sign in required
        "403":
          description: Dispatch edit access required
        "404":
          description: Order not found
  /dispatch/orders/{id}/plan:
    patch:
      operationId: updateDispatchOrderPlan
      tags: [dispatch]
      summary: Create, edit, or remove dispatches and assign ready windows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchPlanUpdate"
      responses:
        "200":
          description: Updated dispatch plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchOrder"
        "400":
          description: Invalid dispatch plan
        "401":
          description: Sign in required
        "403":
          description: Dispatch edit access required
        "404":
          description: Order not found
        "409":
          description: Dispatch plan changed or selected windows are unavailable
  /installation/orders:
    get:
      operationId: listInstallationOrders
      tags: [installation]
      summary: List delivered orders and their installation state
      responses:
        "200":
          description: Delivered orders for installation tracking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallationOrderList"
        "401":
          description: Sign in required
        "403":
          description: Installation view access required
  /installation/share/{token}:
    get:
      operationId: getPublicInstallationShare
      tags: [installation]
      summary: Read the job details for a valid installation sharing token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 40
            maxLength: 100
      responses:
        "200":
          description: Read-only installation job details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicInstallationShare"
        "404":
          description: The installation link is invalid or no longer active
  /installation/share/{token}/drawing:
    get:
      operationId: getPublicInstallationDrawing
      tags: [installation]
      summary: Download the current drawing attached to a shared installation
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 40
            maxLength: 100
      responses:
        "200":
          description: Current window drawing PDF
          content:
            application/pdf:
