components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PermissionLevel:
      type: string
      enum: [none, view, edit]
    PermissionMap:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/PermissionLevel"
    Role:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        isSystem:
          type: boolean
        permissions:
          $ref: "#/components/schemas/PermissionMap"
      required: [id, name, description, isSystem, permissions]
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        username:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        roleId:
          type: string
        roleName:
          type: string
        status:
          type: string
          enum: [active, inactive]
        lastLogin:
          type: ["string", "null"]
          format: date-time
        permissions:
          $ref: "#/components/schemas/PermissionMap"
        permissionOverrides:
          type: ["object", "null"]
          additionalProperties:
            $ref: "#/components/schemas/PermissionLevel"
      required:
        - id
        - name
        - username
        - email
        - phone
        - avatarUrl
        - roleId
        - roleName
        - status
        - lastLogin
        - permissions
        - permissionOverrides
    AuthSession:
      type: object
      properties:
        authenticated:
          type: boolean
        user:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
      required: [authenticated, user]
    LoginInput:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required: [username, password]
    UserInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 3
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
          maxLength: 180000
        roleId:
          type: string
        password:
          type: string
          minLength: 8
        permissionOverrides:
          type: ["object", "null"]
          additionalProperties:
            $ref: "#/components/schemas/PermissionLevel"
      required: [name, username, roleId, password]
    UserUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 3
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
          maxLength: 180000
        roleId:
          type: string
        password:
          type: string
          minLength: 8
        status:
          type: string
          enum: [active, inactive]
        permissionOverrides:
          type: ["object", "null"]
          additionalProperties:
            $ref: "#/components/schemas/PermissionLevel"
    RoleInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        description:
          type: ["string", "null"]
        permissions:
          $ref: "#/components/schemas/PermissionMap"
      required: [name, permissions]
    RoleUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        description:
          type: ["string", "null"]
        permissions:
          $ref: "#/components/schemas/PermissionMap"
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]
    Client:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        address:
          type: string
        gstin:
          type: ["string", "null"]
        prefix:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, phone, address, gstin, prefix, isActive, createdAt, updatedAt]
    ClientInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          minLength: 7
          maxLength: 20
        address:
          type: string
          minLength: 3
          maxLength: 500
        gstin:
          type: ["string", "null"]
          maxLength: 15
          pattern: "^[0-9A-Za-z]{15}$"
        prefix:
          type: string
          minLength: 1
          maxLength: 8
          pattern: "^[A-Za-z0-9]+$"
      required: [name, phone, address, prefix]
    ClientUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          minLength: 7
          maxLength: 20
        address:
          type: string
          minLength: 3
          maxLength: 500
        gstin:
